[project]
name = "llm-verbosity"
version = "0.1.0"
description = "Measure how verbose (time / thinking / completion / total tokens) LLM APIs are on easy, mid and hard Q/A."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "datasets>=5.1.0",
    "httpx>=0.28.1",
    "polars>=2.1.0",
    "rich>=15.0.0",
]

[project.scripts]
llm-verbosity-prepare-data = "llm_verbosity.filter_data.prepare:main"
llm-verbosity-run = "llm_verbosity.run_analysis:main"

[dependency-groups]
dev = ["ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_verbosity"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "SIM"]
